<!DOCTYPE html>
<html lang="ru">
<head>
    <script>(function(){try{var t=localStorage.getItem('theme');if(t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест | mngment</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/home.css">
</head>
<body>
    <canvas id="heroCanvas" aria-hidden="true"></canvas>

    <header class="header">
        <div class="container">
            <a href="/" class="logo">mng<span>ment</span></a>
            <nav class="nav" id="mainNav">
                <a href="/#services">Услуги</a>
                <a href="/cases/">Кейсы</a>
                <a href="/blog/">Блог</a>
                <a href="/contacts/" class="btn btn-ghost">Контакты</a>
            </nav>
            <button class="theme-toggle" id="themeToggle" type="button" aria-label="Переключить тему" aria-pressed="false"><span class="theme-toggle__icon" aria-hidden="true">☀</span></button>
            <button class="burger" id="burgerBtn" aria-label="Открыть меню" aria-expanded="false">☰</button>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="container"></div>
        </section>
    </main>

    <script src="/script.js" defer></script>
    <script src="/theme-toggle.js" defer></script>
    <script src="/home.js" defer></script>
</body>
</html>
